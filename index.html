<style>

hint{background:#f1f5fd;border-radius:12px;padding:11px 14px;color:#566c88;font-size:13px;margin:12px 0}.reward{font-size:27px;background:#fff8dd;border:2px solid #f4dfad;border-radius:17px;padding:17px;display:flex;gap:11px;align-items:center;margin:8px 0}.reward small{display:block;color:#788397;font-size:12px}.footer{text-align:center;color:#8c989e;font-size:12px;padding:18px}.speak{border:0;background:#ebefff;color:#384d91;border-radius:11px;font-size:14px;padding:10px 12px;font-weight:800}.ingredients{color:#59725c;font-weight:700;font-size:14px}.steps{padding-left:26px}.steps li{margin:12px 0;line-height:1.5}.steps button{margin-left:8px}.note{font-size:12px;color:#7e6d66}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{min-width:0}@media(max-width:560px){#app{padding:8px 10px 28px}.hero{grid-template-columns:1fr .85fr;min-height:225px}.hero-copy{padding:18px 7px 16px 13px}.hero h1{font-size:25px}.hero p{font-size:13px}.hero img{object-position:47% 40%}.grid{gap:10px}.mode{min-height:117px;padding:10px;gap:9px;flex-direction:column;justify-content:center;text-align:center}.mode .em{font-size:36px}.mode b{font-size:15px}.mode small{font-size:11px;margin-top:4px}.card{padding:15px}.fridge{grid-template-columns:repeat(3,minmax(0,1fr))}.primary{padding:12px 15px;font-size:15px}.pill{font-size:11px}}
</style></head><body><div id="app"></div><script>
'use strict';
const KEY='angel-joaquin-game-v1';
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}
state.badges=state.badges||[];state.builds=state.builds||{};state.recipeDone=state.recipeDone||[];
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const app=document.querySelector('#app');let page='home',world=0,stage=0,chosen=null,notice='',recipe=0,fridgeAdded=[],cookingStep=0,buildType='maison',tool='🏡',board=[],cards=[],openCards=[],matched=[],lock=false,mini='memory',soundQuestion=0;
const adventures=[
{title:'L’île mystérieuse',emoji:'🏝️',intro:'Une carte magique vous mène à un trésor caché. Pour ouvrir le coffre, il faut réussir les épreuves des deux frères !',tasks:[
{who:'Angel',title:'Le message du pirate',text:'Le capitaine a caché son trésor à l’endroit où les vagues rencontrent le sable. Où faut-il chercher ?',options:['Dans la forêt','Sur la plage','Au sommet du volcan'],answer:1},
{who:'Joaquin',title:'Le coquillage magique',text:'Touche le SOLEIL jaune pour éclairer la plage !',options:['🌙','☀️','🌧️'],answer:1},
{who:'Angel',title:'Le code du coffre',text:'Sur la carte, il y a 8 pièces d’or. Le perroquet en emporte 3. Combien en reste-t-il ?',options:['4','5','6'],answer:1},
{who:'Joaquin',title:'La clé du trésor',text:'Choisis la clé pour ouvrir le coffre !',options:['🧸','🗝️','🍎'],answer:1}]},
{title:'La vallée des dinosaures',emoji:'🦖',intro:'Des œufs de dinosaures ont disparu. Il faut les retrouver avant le coucher du soleil !',tasks:[
{who:'Angel',title:'L’indice des empreintes',text:'Trois dinosaures ont laissé 4 empreintes chacun. Combien d’empreintes au total ?',options:['7','12','16'],answer:1},
{who:'Joaquin',title:'Retrouve l’œuf',text:'Quel objet est un œuf ?',options:['🪨','🥚','🌽'],answer:1},
{who:'Angel',title:'Le bébé dinosaure',text:'Trouve le mot correctement écrit.',options:['Dinausore','Dinosaure','Dinosore'],answer:1},
{who:'Joaquin',title:'La maman dinosaure',text:'Quel animal est un dinosaure ?',options:['🐠','🦕','🐱'],answer:1}]},
{title:'Le château enchanté',emoji:'🏰',intro:'Le pont du château est fermé ! Angel et Joaquin doivent réveiller la magie pour entrer.',tasks:[
{who:'Angel',title:'La porte secrète',text:'Je suis un nombre plus grand que 10, plus petit que 14 et impair. Qui suis-je ?',options:['11','12','14'],answer:0},
{who:'Joaquin',title:'La couleur du dragon',text:'Trouve le cœur rouge !',options:['💙','💚','❤️'],answer:2},
{who:'Angel',title:'La formule',text:'Choisis la bonne phrase.',options:['Le dragon dor.','Le dragon dort.','Le dragon dors.'],answer:1},
{who:'Joaquin',title:'La fête du roi',text:'Trouve la couronne !',options:['👑','🧦','🚗'],answer:0}]}];
const recipes=[
{name:'Gâteau au yaourt',emoji:'🍰',foods:['🥚','🥛','🌾','🍬','🫒'],extras:['Yaourt','Farine','Sucre','Œufs','Huile'],steps:['Préchauffer le four à 180 °C : un adulte s’en charge.','Verser 1 pot de yaourt dans un saladier.','Ajouter 2 pots de sucre et 3 pots de farine.','Ajouter 3 œufs et 1/2 pot d’huile, puis mélanger.','Verser dans un moule avec l’aide d’un adulte.','Un adulte enfourne pour environ 30 à 35 minutes et vérifie la cuisson.']},
{name:'Salade de fruits',emoji:'🍓',foods:['🍌','🍎','🍓','🍊'],extras:['Banane','Pomme','Fraises','Orange'],steps:['Laver soigneusement les fruits.','Un adulte découpe les fruits en petits morceaux adaptés à l’âge de Joaquin.','Verser les fruits dans un grand saladier.','Mélanger doucement avec une cuillère.','Servir la salade de fruits !']},
{name:'Mini-pizzas',emoji:'🍕',foods:['🍞','🍅','🧀','🫒'],extras:['Pâte à pizza','Tomate','Fromage','Olives'],steps:['Un adulte préchauffe le four à 200 °C.','Étaler la pâte sur une plaque.','Ajouter la sauce tomate avec une cuillère.','Parsemer de fromage et ajouter les garnitures.','Un adulte enfourne environ 12 à 15 minutes et vérifie la cuisson.']}];
const allfoods=['🥚','🥛','🌾','🍬','🫒','🍌','🍎','🍓','🍊','🍞','🍅','🧀','🥕','🥔','🥦','🍯','🍫','🍇'];
const foodnames={'🥚':'Œufs','🥛':'Yaourt / lait','🌾':'Farine','🍬':'Sucre','🫒':'Huile / olives','🍌':'Banane','🍎':'Pomme','🍓':'Fraises','🍊':'Orange','🍞':'Pâte','🍅':'Tomate','🧀':'Fromage','🥕':'Carotte','🥔':'Pomme de terre','🥦':'Brocoli','🍯':'Miel','🍫':'Chocolat','🍇':'Raisin'};
const buildsets={maison:['🏡','🚪','🪟','🪑','🛏️','🌳','🌷','🪴','🐕','🚗','🧱','🧹'],jardin:['🌳','🌲','🌼','🌻','🌹','🪴','🦋','🐰','🐝','🌈','⛲','🪨'],espace:['🚀','🌙','⭐','🪐','🛸','👽','☄️','🛰️','🌍','🤖','🔭','✨']};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(s){if(!('speechSynthesis'in window)){notice='La lecture vocale n’est pas disponible ici.';render();return}window.speechSynthesis.cancel();let msg=new SpeechSynthesisUtterance(s);msg.lang='fr-FR';msg.rate=.87;window.speechSynthesis.speak(msg)}
function header(){return `<header class="top"><div class="logo"><span>🧭</span><span class="brand">ANGEL & JOAQUIN</span></div><span class="pill">🏆 ${state.badges.length} trésor${state.badges.length>1?'s':''}</span></header>`}
function head(t){return `<div class="page-head"><button class="back" data-act="home">← Accueil</button><h1>${t}</h1></div>`}
function home(){return `${header()}<section class="hero"><div class="hero-copy"><h1>Les aventures<br>d’Angel & Joaquin</h1><p>Deux frères, mille découvertes !</p><button class="primary" data-act="adventures">▶ Jouer</button></div><img src="assets/heros.webp" alt="Illustration des deux frères explorateurs"></section><h2 class="subtitle">Choisis ton aventure ✨</h2><div class="grid"><button class="mode one" data-act="adventures"><span class="em">🗺️</span><span><b>Aventures & énigmes</b><small>Résoudre des mystères ensemble</small></span></button><button class="mode two" data-act="kitchen"><span class="em">👩‍🍳</span><span><b>Cuisine & recettes</b><small>Un frigo rempli d'ingrédients !</small></span></button><button class="mode three" data-act="build"><span class="em">🧱</span><span><b>Construis & crée</b><small>Maison, jardin ou planète</small></span></button><button class="mode four" data-act="mini"><span class="em">🎮</span><span><b>Mini-jeux</b><small>Mémoire, animaux et découvertes</small></span></button><button class="mode five" data-act="discover"><span class="em">📖</span><span><b>Mes découvertes</b><small>Le livre de nos recettes</small></span></button><button class="mode six" data-act="rewards"><span class="em">🏆</span><span><b>Mes trésors</b><small>Vos belles réussites</small></span></button></div><p class="footer">Sans publicité • Pas de compte • Pour jouer ensemble ❤️</p>`}
function adventuresView(){return `${header()}${head('🗺️ Les aventures')}<div class="card"><h2>Le livre magique 📖</h2><p class="muted">Angel et Joaquin réussissent chacun leurs défis pour faire avancer l’histoire. Chacun son tour !</p><div class="level-list">${adventures.map((a,i)=>`<button class="level" data-world="${i}"><em>${a.emoji}</em><b>${a.title}</b><span class="tag">${state.badges.includes('av'+i)?'✅ Aventure réussie':'4 défis à découvrir'}</span></button>`).join('')}</div></div>`}
function gameView(){const a=adventures[world],q=a.tasks[stage];if(stage>=a.tasks.length)return `${header()}${head(a.title)}<div class="card" style="text-align:center"><div style="font-size:76px">🎉🏆🎉</div><h2>Bravo, Angel et Joaquin !</h2><p>Vous avez réussi ensemble : ${a.title} !</p><p class="muted">Votre trésor est dans l’album des récompenses.</p><button class="primary" data-act="adventures">Choisir une autre aventure →</button></div>`;return `${header()}${head(a.emoji+' '+a.title)}<div class="card"><span class="tag">Étape ${stage+1} / ${a.tasks.length}</span><div class="progress"><i style="width:${stage/a.tasks.length*100}%"></i></div>${stage===0?`<p class="story">${a.intro}</p>`:''}<div class="actionrow"><span class="avatar">${q.who==='Angel'?'🧑':'👶'}</span><h2 style="margin:0">À toi, ${q.who} !</h2></div><h2 style="margin-top:16px">${q.title}</h2><p class="story">${q.text}</p><button class="speak" data-speak="${esc(q.text)}">🔊 Écouter la consigne</button><div class="selection">${q.options.map((opt,i)=>`<button class="choice ${chosen===i?(i===q.answer?'correct':'wrong'):''}" data-answer="${i}">${esc(opt)}</button>`).join('')}</div><div class="feedback" role="status">${notice}</div>${chosen===q.answer?`<button class="primary" data-act="next">Bravo ! Étape suivante →</button>`:''}</div>`}
function kitchenView(){const r=recipes[recipe],complete=r.foods.every(x=>fridgeAdded.includes(x));return `${header()}${head('👩‍🍳 La cuisine magique')}<div class="card"><h2>Choisis une recette</h2><div class="selection">${recipes.map((x,i)=>`<button class="choice ${recipe===i?'selected':''}" data-recipe="${i}">${x.emoji} ${x.name}</button>`).join('')}</div><h2>🧊 Ouvre le frigo !</h2><p class="muted">Angel lit les ingrédients. Joaquin touche les aliments pour les mettre dans le saladier.</p><p class="ingredients">Pour ${r.name} : ${r.extras.join(' • ')}</p><div class="fridge">${allfoods.map(f=>`<button class="food ${fridgeAdded.includes(f)?'added':''}" data-food="${f}"><span>${f}</span>${foodnames[f]}</button>`).join('')}</div><h2 style="margin-top:22px">🥣 Notre saladier</h2><div class="bowl">${fridgeAdded.length?fridgeAdded.map(f=>`<span style="font-size:31px">${f}</span>`).join(''):'<span class="muted">Le saladier est vide… Choisissez vos ingrédients !</span>'}</div><p class="muted">Les ingrédients sélectionnés sont illustratifs : la liste et les quantités de la recette font foi.</p><div class="actionrow"><button class="choice" data-act="emptyBowl">🧹 Vider le saladier</button>${complete?`<button class="primary" data-act="recipeSteps">📖 Suivre la recette →</button>`:''}</div><div class="feedback" role="status">${notice}</div></div>`}
function recipeStepsView(){const r=recipes[recipe],done=state.recipeDone.includes(recipe);return `${header()}${head('📖 '+r.name)}<div class="card"><span class="tag">Cuisine réelle • Avec un adulte</span><h2>On prépare ${r.name} ${r.emoji}</h2><div class="hint">⚠️ Un adulte utilise le couteau, le four et les appareils chauds. Joaquin peut verser et mélanger avec surveillance.</div><ol class="steps">${r.steps.map((s,i)=>`<li style="opacity:${i<cookingStep?.55:1}">${s} ${i===cookingStep?`<button class="choice" data-act="cookNext">✓ C'est fait</button>`:i<cookingStep?'✅':''}</li>`).join('')}</ol>${cookingStep>=r.steps.length?`<div class="success">🎉 Vous avez terminé ! ${done?'Recette déjà enregistrée.':'La recette est ajoutée au livre des découvertes.'}</div><button class="primary" data-act="discover">📖 Notre livre →</button>`:''}<button class="speak" data-speak="${esc(r.steps[Math.min(cookingStep,r.steps.length-1)])}">🔊 Lire l’étape</button></div>`}
function resetBoard(){board=[...Array(30)].map(()=> ''); if(state.builds[buildType])board=state.builds[buildType].slice();tool=buildsets[buildType][0]}
function buildView(){return `${header()}${head('🧱 Construis & crée')}<div class="card"><h2>Ton monde, tes idées !</h2><p class="muted">Choisis un décor, puis un objet et touche une case pour le placer. Tu peux créer autant que tu veux !</p><div class="selection">${[['maison','🏡 Maison'],['jardin','🌻 Jardin'],['espace','🚀 Espace']].map(([k,n])=>`<button class="choice ${buildType===k?'selected':''}" data-build="${k}">${n}</button>`).join('')}</div><h2>Choisis un objet</h2><div class="selection">${buildsets[buildType].map(t=>`<button aria-label="Placer ${t}" class="tool ${tool===t?'selected':''}" data-tool="${t}">${t}</button>`).join('')}<button class="tool ${tool==='X'?'selected':''}" data-tool="X" aria-label="Gomme">🧽</button></div><div class="tilegrid" aria-label="Grille de construction">${board.map((x,i)=>`<button class="tile" data-cell="${i}" aria-label="Case ${i+1}">${x}</button>`).join('')}</div><div class="actionrow"><button class="choice" data-act="clearBuild">🧹 Tout effacer</button><span class="tag">💾 Création sauvegardée automatiquement</span></div></div>`}
function setupMemory(){const sym=['🦕','🦋','🌈','🚀'];cards=[...sym,...sym].map((v,i)=>({id:i,v})).sort(()=>Math.random()-.5);openCards=[];matched=[];lock=false}
const animalQ=[{q:'Quel animal fait « miaou » ?',answers:['🐶','🐱','🐸'],correct:1},{q:'Quel animal peut voler ?',answers:['🐟','🐘','🦜'],correct:2},{q:'Quel animal fait « meuh » ?',answers:['🐄','🦊','🐢'],correct:0},{q:'Quel animal vit dans la mer ?',answers:['🐇','🦈','🐓'],correct:1}];
function miniView(){return `${header()}${head('🎮 Les mini-jeux')}<div class="card"><div class="selection"><button class="choice ${mini==='memory'?'selected':''}" data-mini="memory">🧠 Memory</button><button class="choice ${mini==='animals'?'selected':''}" data-mini="animals">🐾 Les animaux</button></div>${mini==='memory'?`<h2>Retrouve les paires !</h2><p class="muted">Retourne deux cartes identiques. Tu peux jouer seul ou à deux.</p><div class="memory">${cards.map((x,i)=>`<button data-card="${i}" class="${matched.includes(i)?'matched':openCards.includes(i)?'open':''}" ${matched.includes(i)?'disabled':''}>${matched.includes(i)||openCards.includes(i)?x.v:'❔'}</button>`).join('')}</div>${matched.length===cards.length?'<div class="success">🎉 Super mémoire ! Toutes les paires sont trouvées !</div>':''}<button class="choice" data-act="resetMemory">🔄 Recommencer</button>`:`<h2>Qui est cet animal ?</h2><p class="story">${animalQ[soundQuestion%animalQ.length].q}</p><button class="speak" data-speak="${esc(animalQ[soundQuestion%animalQ.length].q)}">🔊 Écouter</button><div class="selection">${animalQ[soundQuestion%animalQ.length].answers.map((x,i)=>`<button class="choice" style="font-size:35px" data-animal="${i}">${x}</button>`).join('')}</div><div class="feedback">${notice}</div>`}</div>`}
function discoverView(){return `${header()}${head('📖 Mes découvertes')}<div class="card"><h2>Notre livre de recettes 👩‍🍳</h2><p class="muted">Les recettes que vous avez réalisées ensemble se retrouvent ici.</p>${state.recipeDone.length?state.recipeDone.map(i=>`<button class="level" data-recipe-book="${i}" style="margin:8px;width:100%;display:block;text-align:left">${recipes[i].emoji} ${recipes[i].name} <span class="tag">Revoir la recette</span></button>`).join(''):'<div class="hint">Le livre est encore vide. Préparons notre première recette !</div>'}<button class="primary" data-act="kitchen">🧊 Aller dans la cuisine</button></div>`}
function rewardsView(){return `${header()}${head('🏆 Mes trésors')}<div class="card"><h2>Vos aventures réussies</h2>${state.badges.length?state.badges.map(k=>{const i=+k.slice(2);return `<div class="reward">${adventures[i]?.emoji||'🌟'}<span><b>${adventures[i]?.title||'Une aventure'}</b><small>Réussie ensemble !</small></span>🏆</div>`}).join(''):'<p class="muted">Pas encore de trésor ! La première aventure vous attend.</p>'}<button class="primary" data-act="adventures">🗺️ Partir à l'aventure</button></div><div class="card"><h2>Nos constructions</h2><p class="muted">Vos mondes sont conservés sur ce téléphone : maison, jardin et espace.</p><button class="choice" data-act="build">🧱 Construire</button></div>`}
function render(){app.innerHTML=({home,adventures:adventuresView,game:gameView,kitchen:kitchenView,recipeSteps:recipeStepsView,build:buildView,mini:miniView,discover:discoverView,rewards:rewardsView}[page]||home)()}
function nav(p){page=p;chosen=null;notice='';if(p==='build'&&!board.length)resetBoard();if(p==='mini'&&!cards.length)setupMemory();render();window.scrollTo({top:0,behavior:'instant'})}
app.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;
if(el.dataset.speak){speak(el.dataset.speak);return}
if(el.dataset.world!==undefined){world=+el.dataset.world;stage=0;nav('game');return}
if(el.dataset.answer!==undefined){const a=adventures[world].tasks[stage];chosen=+el.dataset.answer;notice=chosen===a.answer?'✨ Bravo ! Vous avez trouvé !':'Essaie encore, tu peux y arriver 🌷';render();return}
if(el.dataset.recipe!==undefined){recipe=+el.dataset.recipe;fridgeAdded=[];cookingStep=0;notice='';render();return}
if(el.dataset.food){const f=el.dataset.food;fridgeAdded.includes(f)?fridgeAdded=fridgeAdded.filter(x=>x!==f):fridgeAdded.push(f);notice=recipes[recipe].foods.every(x=>fridgeAdded.includes(x))?'Bravo, tous les ingrédients sont dans le saladier ! 🍽️':'';render();return}
if(el.dataset.build){buildType=el.dataset.build;resetBoard();render();return}
if(el.dataset.tool){tool=el.dataset.tool;render();return}
if(el.dataset.cell!==undefined){board[+el.dataset.cell]=tool==='X'?'':tool;state.builds[buildType]=board.slice();store();render();return}
if(el.dataset.mini){mini=el.dataset.mini;notice='';if(mini==='memory')setupMemory();render();return}
if(el.dataset.card!==undefined){const i=+el.dataset.card;if(lock||matched.includes(i)||openCards.includes(i)||openCards.length>=2)return;openCards.push(i);if(openCards.length===2){const[a,b]=openCards;if(cards[a].v===cards[b].v){matched.push(a,b);openCards=[]}else{lock=true;setTimeout(()=>{openCards=[];lock=false;if(page==='mini')render()},700)}}render();return}
if(el.dataset.animal!==undefined){let q=animalQ[soundQuestion%animalQ.length];if(+el.dataset.animal===q.correct){soundQuestion++;notice='';render();if(soundQuestion%animalQ.length===0){notice='🎉 Bravo ! Tu connais tous ces animaux !';render()}}else{notice='Pas tout à fait ! Essaie encore 🌷';render()}return}
if(el.dataset.recipeBook!==undefined){recipe=+el.dataset.recipeBook;cookingStep=0;nav('recipeSteps');return}
let act=el.dataset.act;if(!act)return;
if(['home','adventures','kitchen','build','mini','discover','rewards'].includes(act)){nav(act);return}
if(act==='next'){stage++;chosen=null;notice='';if(stage>=adventures[world].tasks.length&&!state.badges.includes('av'+world)){state.badges.push('av'+world);store()}render();return}
if(act==='emptyBowl'){fridgeAdded=[];notice='';render();return}
if(act==='recipeSteps'){cookingStep=0;nav('recipeSteps');return}
if(act==='cookNext'){cookingStep++;if(cookingStep>=recipes[recipe].steps.length&&!state.recipeDone.includes(recipe)){state.recipeDone.push(recipe);store()}render();return}
if(act==='clearBuild'){board=Array(30).fill('');state.builds[buildType]=board.slice();store();render();return}
if(act==='resetMemory'){setupMemory();render();return}
});
render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
